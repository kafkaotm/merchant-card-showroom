<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>momo card sample</title>
  </head>
  <body>
    <!--
      Zero-build, zero-server usage sample: run `npm run build:lib` once,
      then just double-click this file — no dev server needed.

      Loads dist/momo-cards.iife.js, not the ES build (dist/momo-cards.js).
      A `<script type="module">` fetching another module from a file://
      page is blocked by CORS in Chrome; a classic (non-module) <script>
      is not. IIFE is what makes true double-click-to-open work, not just
      "open via a static server" — see vite.lib.config.ts.

      Both cards below render the exact same product record — this is
      the "view variant" extension axis: one schema, two renderers.
      List additionally emits card-follow / card-add-to-cart events,
      logged below instead of wired to anything real.
    -->
    <script src="./dist/momo-cards.iife.js"></script>
    <script>
      window.addEventListener("card-follow", () => console.log("card-follow"));
      window.addEventListener("card-add-to-cart", () => console.log("card-add-to-cart"));
    </script>

    <h1>Grid view</h1>
    <momo-grid-card
      product-title="ASUS 華碩 15.6吋Core7輕薄筆電-藍 (VivoBook X1504VA/Core7-150U/16G/1TB SSD/W11)"
      price="27999"
      rating="4.5"
      review-count="364"
    ></momo-grid-card>

    <h1>List view</h1>
    <momo-list-card
      product-title="ASUS 華碩 15.6吋Core7輕薄筆電-藍 (VivoBook X1504VA/Core7-150U/16G/1TB SSD/W11)"
      price="27999"
      rating="4.5"
      review-count="364"
    ></momo-list-card>
  </body>
</html>
